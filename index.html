<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training"><meta name="theme-color" content="#13110D">
<title>Training Log</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#13110D;--surface:#1C1912;--surface2:#242019;--line:#342E22;--line-soft:#241F17;--text:#F3EEE1;--dim:#B8AF9C;--faint:#7C7563;--lift:#6FA0BE;--lift-d:#2B3D48;--core:#C9A15A;--core-d:#443622;--plyo:#D7BC4C;--plyo-d:#453D22;--rec:#7FA07A;--rec-d:#2B3B29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text)}body{font-family:Inter,sans-serif;padding-bottom:88px;min-height:100vh}.safe{height:env(safe-area-inset-top)}
header{padding:18px 20px 14px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,transparent)}.eyebrow{font:11px JetBrains Mono;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--plyo);margin-right:8px}h1{font:600 26px Oswald;margin:0;text-transform:uppercase}
.view{display:none}.view.active{display:block}.week{display:flex;gap:8px;padding:14px 20px 4px;overflow:auto;scrollbar-width:none}.week::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;width:46px;padding:9px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line-soft);text-align:center}.chip.selected{background:var(--surface2)}.chip.today{border-color:var(--plyo)}.dow{font:10px JetBrains Mono;color:var(--faint)}.num{font:16px Oswald;color:var(--dim);margin:5px 0}.box{width:18px;height:18px;margin:auto;border:1px solid var(--line);border-radius:5px;font:12px JetBrains Mono;display:flex;align-items:center;justify-content:center}.chip.done .box,.calbox.done{background:var(--plyo);border-color:var(--plyo);color:var(--bg)}
.hero{margin:18px 20px 7px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line-soft);position:relative;overflow:hidden}.bar{position:absolute;left:0;top:0;bottom:0;width:5px}.label{font:11px JetBrains Mono;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}.hero h2{font:700 24px Oswald;text-transform:uppercase;margin:6px 0 10px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;padding:5px 10px;border-radius:20px}.status{margin:0 20px 12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;font:11px JetBrains Mono;color:var(--dim);display:flex;justify-content:space-between}.complete{color:var(--rec)!important}.sections{padding:6px 20px;display:flex;flex-direction:column;gap:10px}.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden}.head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}.accent{position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:3px}.icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}.title{flex:1}.name{font:500 15px Oswald;text-transform:uppercase}.meta{font:11px JetBrains Mono;color:var(--faint);margin-top:2px}.chev{color:var(--faint);font-size:18px}.body{display:none;padding:2px 18px 16px 18px}.card.open .body{display:block}.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}.row:last-child{border-bottom:0}.check{width:23px;height:23px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:transparent;font:14px JetBrains Mono;flex:0 0 auto}.row.done .check{background:var(--rec);border-color:var(--rec);color:var(--bg)}.row.done .ename{text-decoration:line-through;color:var(--faint)}.ename{font-size:13.5px;flex:1}.scheme{font:12px JetBrains Mono;color:var(--dim);white-space:nowrap}.bullet{font-size:13.5px;color:var(--dim);padding:8px 0}.rest{padding:14px 0;color:var(--dim);font-size:13.5px;line-height:1.6}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 20px calc(8px + env(safe-area-inset-bottom));background:rgba(19,17,13,.97);border-top:1px solid var(--line-soft);display:flex;gap:8px}.tab{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;color:var(--dim);padding:11px;font:12px JetBrains Mono}.tab.active{background:var(--surface2);color:var(--text);border-color:var(--line)}
.calendar{padding:6px 20px}.monthhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}.monthtitle{font:600 23px Oswald;text-transform:uppercase}.nav{display:flex;gap:7px}.nav button{width:38px;height:34px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface);color:var(--text);font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;padding:11px 8px}.v{font:600 19px Oswald}.l{font:9px JetBrains Mono;color:var(--faint);margin-top:3px;text-transform:uppercase}.cal{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid .dh{text-align:center;font:9px JetBrains Mono;color:var(--faint);padding-bottom:5px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center}.calbox{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font:11px JetBrains Mono;color:var(--dim)}.calbox.today{border-color:var(--plyo)}.calbox.rest{opacity:.3}.calbox.future{opacity:.38}.note{text-align:center;color:var(--faint);font-size:11px;line-height:1.5;margin:14px 8px}
</style></head><body><div class="safe"></div><header><div class="eyebrow"><span class="dot"></span>Training</div><h1>Training Log</h1></header>
<section id="training" class="view active"><div class="week" id="week"></div><div class="hero"><div class="bar" id="bar"></div><div class="label" id="label"></div><h2 id="hero"></h2><div class="tags" id="tags"></div></div><div class="status"><span id="progress"></span><strong id="daystatus"></strong></div><div class="sections" id="sections"></div></section>
<section id="calendar" class="view"><div class="calendar"><div class="monthhead"><div class="monthtitle" id="monthtitle"></div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="stats"><div class="stat"><div class="v" id="sd"></div><div class="l">Completed</div></div><div class="stat"><div class="v" id="sp"></div><div class="l">Completion</div></div><div class="stat"><div class="v" id="ss"></div><div class="l">Best streak</div></div></div><div class="cal"><div class="grid"><div class="dh">MON</div><div class="dh">TUE</div><div class="dh">WED</div><div class="dh">THU</div><div class="dh">FRI</div><div class="dh">SAT</div><div class="dh">SUN</div></div><div class="grid" id="days"></div><div class="note">Filled boxes are completed workout days. Wednesdays are automatic rest days and are not counted.</div></div></div></section>
<nav class="bottom"><button class="tab active" id="tb">TRAINING</button><button class="tab" id="cb">CALENDAR</button></nav>
<script>
const M={lift:['Lift','--lift','--lift-d'],core:['Core','--core','--core-d'],plyo:['Speed','--plyo','--plyo-d'],recovery:['Recovery','--rec','--rec-d']};
const E=(n,s)=>({t:'e',n,s}),B=t=>({t:'b',x:t}),BL=(c,n,i)=>({c,n,i});
const W=[
{dow:'MON',full:'Monday',tag:'Upper + core',cats:['lift','core'],blocks:[
BL('lift','Upper body',[E('Bench press','3×6–8'),E('Chest-supported row','3×6–8'),E('Pec deck','2×8–12'),E('Lat pulldown','2×8–12'),E('Bicep curls','3×8–12'),E('Tricep pushdowns','3×10–12'),E('Forearm curls','2–3×12–15')]),
BL('core','Core',[E('Leg raises','2–3 sets'),E('Dead bugs','2–3 sets'),E('Cable crunches','2–3 sets'),E('Pallof press','2–3 sets')])]},
{dow:'TUE',full:'Tuesday',tag:'Lower + plyos',cats:['plyo','lift'],blocks:[
BL('plyo','Plyometrics',[E('Pogo jumps','3×10'),E('Vertical jumps','3×4'),E('Broad jumps','3×3'),E('Lateral line hops','3×10s/side'),E('Falling starts','3×10–15yd')]),
BL('lift','Lower body',[E('Leg press','3×6–8'),E('Hamstring curl','3×8–12'),E('Leg extension','3×8–12'),E('Bulgarian split squat','3×8/leg'),E('Glute bridge','3×10'),E('DB calf raises','3×15')])]},
{dow:'WED',full:'Wednesday',tag:'Recovery',cats:['recovery'],rest:true,blocks:[BL('recovery','Recovery',[B('20–40 minute easy walk'),B('Light mobility / stretching'),B('Recover'),B('Get plenty of sleep')])]},
{dow:'THU',full:'Thursday',tag:'Upper + core',cats:['lift','core'],blocks:[
BL('lift','Upper body',[E('Bench press','3×6–8'),E('Chest-supported row','3×6–8'),E('Pec deck','2×8–12'),E('Lat pulldown','2×8–12'),E('Bicep curls','3×8–12'),E('Tricep pushdowns','3×10–12'),E('Forearm curls','2–3×12–15')]),
BL('core','Core',[E('Leg raises','2–3 sets'),E('Dead bugs','2–3 sets'),E('Cable crunches','2–3 sets'),E('Pallof press','2–3 sets')])]},
{dow:'FRI',full:'Friday',tag:'Sprints + lower',cats:['plyo','lift'],blocks:[
BL('plyo','Sprinting',[E('Acceleration','4×10yd'),E('Acceleration','3×20yd'),B('Full recovery between sprints')]),
BL('lift','Lower body',[E('Leg press','3×8–10'),E('Hamstring curl','3×10–12'),E('Leg extension','2–3×10–15'),E('Bulgarian split squat','2×8/leg'),E('Glute bridge','3×10–12'),E('DB calf raises','3×12–15')])]},
{dow:'SAT',full:'Saturday',tag:'Upper + core',cats:['lift','core'],blocks:[
BL('lift','Upper body',[E('Bench press','3×6–8'),E('Chest-supported row','3×6–8'),E('Pec deck','2×10–12'),E('Lat pulldown','2×10–12'),E('Bicep curls','2–3×10–12'),E('Tricep pushdowns','2–3×10–12'),E('Forearm curls','2×12–15')]),
BL('core','Core',[E('Leg raises','2–3 sets'),E('Dead bugs','2–3 sets'),E('Cable crunches','2–3 sets'),E('Pallof press','2–3 sets')])]},
{dow:'SUN',full:'Sunday',tag:'Lower + plyos + recovery',cats:['plyo','lift','recovery'],blocks:[
BL('plyo','Plyometrics',[E('Pogo jumps','3×10'),E('Vertical jumps','3×4'),E('Broad jumps','3×3'),E('Lateral line hops','3×10s/side'),E('Falling starts','3×10–15yd')]),
BL('lift','Lower body',[E('Leg press','2–3×10–12'),E('Hamstring curl','3×10–15'),E('Leg extension','2×12–15'),E('Bulgarian split squat','2×8–10/leg'),E('Glute bridge','2–3×10–15'),E('DB calf raises','3×15')]),
BL('recovery','Recovery',[E('Easy walk','20–40 min'),B('Mobility / stretching')])]}
];
const KEY='training-log-v2';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),sel=(new Date().getDay()+6)%7,cur=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,ti=d=>((d.getDay()+6)%7);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function exs(i){return W[i].blocks.flatMap(b=>b.i.filter(x=>x.t==='e'))}
function done(k,i){if(W[i].rest)return false;let a=new Set(data[k]||[]),e=exs(i);return e.length&&e.every((_,n)=>a.has(''+n))}
function renderTraining(){
 let now=new Date(),d=W[sel],k=dk(new Date(now.getFullYear(),now.getMonth(),now.getDate()-ti(now)+sel)),a=new Set(data[k]||[]),es=exs(sel);
 document.getElementById('bar').style.background=`var(${M[d.cats[0]][1]})`;document.getElementById('label').textContent=(sel===ti(now)?'Today · ':'')+d.full;document.getElementById('hero').textContent=d.tag;
 document.getElementById('tags').innerHTML=d.cats.map(c=>`<span class="tag" style="background:var(${M[c][2]});color:var(${M[c][1]})">${M[c][0]}</span>`).join('');
 document.getElementById('progress').textContent=d.rest?'Automatic rest day':`${[...a].length} / ${es.length} complete`;
 let ds=document.getElementById('daystatus');ds.textContent=d.rest?'REST DAY':done(k,sel)?'COMPLETED':'IN PROGRESS';ds.className=done(k,sel)?'complete':'';
 let w=document.getElementById('sections');w.innerHTML='';
 d.blocks.forEach(bl=>{let m=M[bl.c],card=document.createElement('div');card.className='card';let body='';
 if(d.rest)body=`<div class="rest">Automatic rest day — this day does not count toward your completion rate.<br><br>· ${bl.i.map(x=>x.x||x.n).join('<br>· ')}</div>`;
 else body='<div>'+bl.i.map(x=>{if(x.t==='b')return `<div class="bullet">· ${x.x}</div>`;let gi=es.indexOf(x),ok=a.has(''+gi);return `<div class="row ${ok?'done':''}" data-i="${gi}"><span class="check">✓</span><span class="ename">${x.n}</span><span class="scheme">${x.s}</span></div>`}).join('')+'</div>';
 card.innerHTML=`<div class="head"><div class="accent" style="background:var(${m[1]})"></div><div class="icon" style="background:var(${m[2]});color:var(${m[1]})">●</div><div class="title"><div class="name">${bl.n}</div><div class="meta">${bl.i.filter(x=>x.t==='e').length} tracked item${bl.i.filter(x=>x.t==='e').length===1?'':'s'}</div></div><div class="chev">⌄</div></div><div class="body">${body}</div>`;
 card.querySelector('.head').onclick=()=>{card.classList.toggle('open')};
 card.querySelectorAll('[data-i]').forEach(r=>r.onclick=e=>{e.stopPropagation();let i=r.dataset.i,arr=data[k]||[];data[k]=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];save();renderTraining()});w.appendChild(card)});
 if(w.firstElementChild)w.firstElementChild.classList.add('open');renderWeek();
}
function renderWeek(){let n=new Date(),w=document.getElementById('week');w.innerHTML='';W.forEach((d,i)=>{let dt=new Date(n.getFullYear(),n.getMonth(),n.getDate()-ti(n)+i),k=dk(dt),c=document.createElement('div');c.className='chip'+(i===sel?' selected':'')+(i===ti(n)?' today':'')+(done(k,i)?' done':'');c.innerHTML=`<div class="dow">${d.dow}</div><div class="num">${i+1}</div><div class="box">${done(k,i)?'✓':''}</div>`;c.onclick=()=>{sel=i;renderTraining()};w.appendChild(c)})}
function stats(y,m){let n=new Date(),arr=[],d=new Date(y,m,1);while(d.getMonth()===m){if(!W[ti(d)].rest&&d<=n)arr.push(d);d.setDate(d.getDate()+1)}let z=arr.filter(x=>done(dk(x),ti(x))).length;return[z,arr.length,arr.length?Math.round(z/arr.length*100):0]}
function streak(y,m){let n=new Date(),d=new Date(y,m,1),r=0,b=0;while(d.getMonth()===m&&d<=n){if(!W[ti(d)].rest){if(done(dk(d),ti(d)))r++;else r=0;b=Math.max(b,r)}d.setDate(d.getDate()+1)}return b}
function renderCal(){let y=cur.getFullYear(),m=cur.getMonth(),s=stats(y,m);document.getElementById('monthtitle').textContent=cur.toLocaleDateString('en-US',{month:'long',year:'numeric'});document.getElementById('sd').textContent=`${s[0]} / ${s[1]}`;document.getElementById('sp').textContent=s[2]+'%';document.getElementById('ss').textContent=streak(y,m)+' days';let g=document.getElementById('days');g.innerHTML='';let first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),today=dk(new Date());for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));for(let n=1;n<=last;n++){let d=new Date(y,m,n),b=document.createElement('div');b.className='cell';let x=document.createElement('div');x.className='calbox';x.textContent=n;if(dk(d)===today)x.classList.add('today');if(W[ti(d)].rest)x.classList.add('rest');if(d>new Date())x.classList.add('future');if(done(dk(d),ti(d)))x.classList.add('done');b.appendChild(x);g.appendChild(b)}}
function view(v){training.classList.toggle('active',v==='t');calendar.classList.toggle('active',v==='c');tb.classList.toggle('active',v==='t');cb.classList.toggle('active',v==='c');if(v==='c')renderCal()}
tb.onclick=()=>view('t');cb.onclick=()=>view('c');prev.onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderCal()};next.onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderCal()};renderTraining();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
